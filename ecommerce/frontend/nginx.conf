# ecommerce/frontend/nginx.conf
server {
    listen 5173;

    # ── API routes → proxy to backend ──────────────────────────
    location /auth       { proxy_pass http://backend:5000; }
    location /products   { proxy_pass http://backend:5000; }
    location /categories { proxy_pass http://backend:5000; }
    location /cart       { proxy_pass http://backend:5000; }
    location /orders     { proxy_pass http://backend:5000; }
    location /users      { proxy_pass http://backend:5000; }
    location /wishlist  { proxy_pass http://backend:5000; }
    location /admin      { proxy_pass http://backend:5000; }
    location /ai         { proxy_pass http://backend:5000; }
    location /otp        { proxy_pass http://backend:5000; }
    location /password   { proxy_pass http://backend:5000; }
    location /images     { proxy_pass http://backend:5000; }

    # ── Everything else → serve React app ───────────────────────
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}