# ecommerce/docker-compose.yml

services:

  # ─── BACKEND ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend        # Docker looks for Dockerfile inside ./backend
      dockerfile: Dockerfile    # The filename to use
      target: production        # Use the "production" stage (not builder)
    container_name: ecommerce-backend
    ports:
      - "5000:5000"             # host:container — your machine:inside container
    env_file:
      - ./backend/.env          # Load your .env file into the container
    environment:
      # Inside Docker, containers talk to each other by SERVICE NAME
      # "localhost" inside backend container = the backend container itself
      # "mongo" = the mongo service defined below
      - REDIS_HOST=redis        # same idea — "redis" is the service name
      - REDIS_PORT=6379
    depends_on:
      mongo:
        condition: service_healthy   # Wait until MongoDB is actually ready
      redis:
        condition: service_healthy   # Wait until Redis is actually ready
    volumes:
      # In development: mount source code so changes reflect without rebuild
      # Comment these out for production builds
      - ./backend:/app
      - /app/node_modules       # Keep container's node_modules, don't overwrite with host's
    networks:
      - ecommerce-network
    restart: unless-stopped     # Restart if it crashes, but not if you manually stop it


  # ─── FRONTEND ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: ecommerce-frontend
    ports:
      - "5173:5173"                 # Nginx serves on port 80
    depends_on:
      - backend
    networks:
      - ecommerce-network
    restart: unless-stopped


  # ─── MONGODB ──────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7              # Official MongoDB image, version 7
    container_name: ecommerce-mongo
    ports:
      - "27017:27017"           # Expose so you can connect with MongoDB Compass locally
    volumes:
      - mongo-data:/data/db     # Named volume — data persists even if container is deleted
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      # Docker runs this command inside the container every 10 seconds
      # If it fails 5 times in a row, container is marked "unhealthy"
      # backend's "depends_on: condition: service_healthy" waits for this
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s             # Check every 10 seconds
      timeout: 5s               # Fail if no response in 5 seconds
      retries: 5                # Try 5 times before marking unhealthy
      start_period: 30s         # Give MongoDB 30s to start before health checks begin


  # ─── REDIS ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine       # Alpine = smaller image (~30MB vs ~100MB)
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data        # Persists Redis data (RDB snapshots)
    command: redis-server --appendonly yes  # Enable AOF persistence
    networks:
      - ecommerce-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


# ─── VOLUMES ────────────────────────────────────────────────────────────────
# Named volumes are managed by Docker — stored outside your project folder
# Data persists even when containers are stopped or removed
# "docker volume ls" to see them
# "docker volume rm ecommerce_mongo-data" to wipe and start fresh
volumes:
  mongo-data:
  redis-data:


# ─── NETWORKS ───────────────────────────────────────────────────────────────
# All services on the same network can talk to each other by service name
# Services NOT on this network can't reach them (isolation)
networks:
  ecommerce-network:
    driver: bridge